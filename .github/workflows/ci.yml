name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Go test and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...

  cli:
    name: CLI / ${{ matrix.name }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows amd64
            os: windows-latest
            goos: windows
            goarch: amd64
            ext: .exe
          - name: Linux amd64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
          - name: macOS arm64
            os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build CLI
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -o "dist/nginx-manager-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" ./cmd/nginx-manager
      - uses: actions/upload-artifact@v4
        with:
          name: nginx-manager-cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  desktop:
    name: Desktop
    uses: wanstu/wails-desktop-kit/.github/workflows/wails-desktop.yml@v0.8.0
    with:
      app-name: nginx-manager-desktop
      desktop-dir: cmd/nginx-manager-desktop
      desktopkit-cli-version: v0.8.0
      test-command: ""
      vet-command: ""
      publish-release: false
