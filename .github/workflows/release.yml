name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - name: Check frontend JavaScript
        run: node --check cmd/nginx-manager-desktop/frontend/app.js

  cli:
    name: CLI / ${{ matrix.name }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows amd64
            os: windows-latest
            goos: windows
            goarch: amd64
            asset: windows-amd64
            ext: .exe
          - name: Linux amd64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            asset: linux-amd64
            ext: ""
          - name: macOS amd64
            os: macos-latest
            goos: darwin
            goarch: amd64
            asset: macos-amd64
            ext: ""
          - name: macOS arm64
            os: macos-latest
            goos: darwin
            goarch: arm64
            asset: macos-arm64
            ext: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build CLI
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          ASSET: ${{ matrix.asset }}
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          mkdir -p dist
          tag="$GITHUB_REF_NAME"
          file="nginx-manager-${tag}-${ASSET}${EXT}"
          go build -trimpath -ldflags "-s -w -X main.version=${tag}" -o "dist/${file}" ./cmd/nginx-manager
          (
            cd dist
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${file}" > "${file}.sha256"
            else
              shasum -a 256 "${file}" > "${file}.sha256"
            fi
          )
      - uses: actions/upload-artifact@v4
        with:
          name: nginx-manager-cli-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  desktop:
    name: Desktop packages
    needs: verify
    uses: wanstu/wails-desktop-kit/.github/workflows/wails-desktop.yml@v0.8.0
    with:
      app-name: nginx-manager-desktop
      desktop-dir: cmd/nginx-manager-desktop
      desktopkit-cli-version: v0.8.0
      test-command: ""
      vet-command: ""
      linux-package-formats: raw,deb,tar.gz
      linux-package-name: nginx-manager-desktop
      linux-package-description: Multi-server Nginx and OpenResty management desktop application
      linux-deb-depends: libgtk-3-0 | libgtk-3-0t64, libwebkit2gtk-4.1-0
      linux-desktop-file: cmd/nginx-manager-desktop/packaging/nginx-manager-desktop.desktop
      linux-icon-file: cmd/nginx-manager-desktop/build/appicon.png
      publish-release: false

  release:
    name: Publish GitHub Release
    needs: [cli, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: nginx-manager-*
          path: dist
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          echo "Release assets:"
          find dist -maxdepth 1 -type f -printf '%f\n' | sort

          required=(
            "nginx-manager-${GITHUB_REF_NAME}-windows-amd64.exe"
            "nginx-manager-${GITHUB_REF_NAME}-linux-amd64"
            "nginx-manager-${GITHUB_REF_NAME}-macos-amd64"
            "nginx-manager-${GITHUB_REF_NAME}-macos-arm64"
            "nginx-manager-desktop-${GITHUB_REF_NAME}-windows-amd64.exe"
            "nginx-manager-desktop-${GITHUB_REF_NAME}-linux-amd64"
            "nginx-manager-desktop-${GITHUB_REF_NAME}-linux-amd64.deb"
            "nginx-manager-desktop-${GITHUB_REF_NAME}-linux-amd64.tar.gz"
            "nginx-manager-desktop-${GITHUB_REF_NAME}-macos-universal.app.zip"
          )
          for file in "${required[@]}"; do
            test -s "dist/${file}" || { echo "Missing release asset: ${file}" >&2; exit 1; }
            test -s "dist/${file}.sha256" || { echo "Missing checksum: ${file}.sha256" >&2; exit 1; }
          done

          (
            cd dist
            for checksum in *.sha256; do
              sha256sum --check "$checksum"
            done
          )

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Nginx Manager $GITHUB_REF_NAME" \
            --generate-notes \
            "${prerelease[@]}"
